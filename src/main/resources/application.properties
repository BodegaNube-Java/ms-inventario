server.port=8083

spring.application.name=ms-inventario

spring.datasource.url=jdbc:postgresql://127.0.0.1:5435/inventario_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Timeout de bloqueo pesimista: si otra transaccion tiene la fila mas de 5s,
# falla en vez de esperar indefinidamente
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

management.endpoints.web.exposure.include=health,info